name: Package GENERAL BOT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice ffmpeg tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng poppler-utils p7zip-full

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Run tests
        run: pytest -q

      - name: Build deployment ZIP
        run: |
          zip -r GENERAL-BOT-Railway.zip . \
            -x ".git/*" ".github/*" ".pytest_cache/*" "__pycache__/*" "*.pyc" ".env" "data/*" "tmp/*"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: GENERAL-BOT-Railway
          path: GENERAL-BOT-Railway.zip
          retention-days: 30
